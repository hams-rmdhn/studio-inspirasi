# Clovercut's Linux packages: one description for the .deb and the .rpm.
#
# Optional nfpm description of the same staged folder used by the native
# packaging scripts and AppImage builder. The program lives
# whole under /opt/clovercut - the binary finds its libraries in lib/ beside
# itself, by rpath, and nothing else on the system has to line up - with
# a launcher on the path, a desktop entry and an icon where the desktop
# looks for them. The version and architecture are handed in as
# environment; the files are named relative to the staged folder, which
# is where nfpm is run from:
#
#   export CLOVERCUT_REPO="$(git rev-parse --show-toplevel)"
#   cd stage/Clovercut-0.1.8-linux-x86_64
#   VERSION=0.1.8 NFPM_ARCH=amd64 nfpm package -f "$CLOVERCUT_REPO/assets/linux/nfpm.yaml" -p deb -t ..
name: studio-inspirasi
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
section: video
priority: optional
maintainer: Studio Inspirasi contributors <66541242+hams-rmdhn@users.noreply.github.com>
vendor: Studio Inspirasi contributors
homepage: https://github.com/hams-rmdhn/studio-inspirasi
license: AGPL-3.0-or-later
description: |
  Desktop-first, open-source video editor with local AI.
  Timeline editing, effects, transitions, titles and on-device captions,
  with FFmpeg underneath and hardware-accelerated preview and export.

contents:
  - src: clovercut
    dst: /opt/studio-inspirasi/studio-inspirasi
    file_info:
      mode: 0755
  - src: lib/*
    dst: /opt/studio-inspirasi/lib/
  - src: ${CLOVERCUT_REPO}/assets/linux/studio-inspirasi
    dst: /usr/bin/studio-inspirasi
    file_info:
      mode: 0755
  - src: io.github.hams-rmdhn.studio-inspirasi.desktop
    dst: /usr/share/applications/io.github.hams-rmdhn.studio-inspirasi.desktop
  - src: clovercut.png
    dst: /usr/share/icons/hicolor/256x256/apps/studio-inspirasi.png
  - src: LICENSE
    dst: /usr/share/doc/studio-inspirasi/LICENSE
  - src: THIRD_PARTY_NOTICES.md
    dst: /usr/share/doc/studio-inspirasi/THIRD_PARTY_NOTICES.md

# What the binary loads from the system rather than from lib/: the
# toolkit the file dialogs use, sound, fonts and OpenGL. Named as each
# family names them.
overrides:
  deb:
    depends:
      - libc6
      - libgtk-3-0
      - libfontconfig1
      - libfreetype6
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libgl1
      - libasound2 | libasound2t64
  rpm:
    depends:
      - "libc.so.6()(64bit)"
      - "libgcc_s.so.1()(64bit)"
      - "libstdc++.so.6()(64bit)"
      - "libgtk-3.so.0()(64bit)"
      - "libfontconfig.so.1()(64bit)"
      - "libfreetype.so.6()(64bit)"
      - "libxkbcommon.so.0()(64bit)"
      - "libxkbcommon-x11.so.0()(64bit)"
      - "libGL.so.1()(64bit)"
      - "libasound.so.2()(64bit)"
