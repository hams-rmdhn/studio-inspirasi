# A release created with GITHUB_TOKEN does not trigger another release event.
# Follow successful release workflows instead, and always run trusted main code.
name: Publish to AUR
'on':
  workflow_run:
    workflows: [Clovercut release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag (empty selects latest)
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: aur-publish
  cancel-in-progress: false
jobs:
  aur:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Check publishing configuration
        id: config
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -n "$AUR_SSH_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::AUR publication skipped: AUR_SSH_KEY is not configured.'
          fi
      - name: Prepare the latest stable release
        if: steps.config.outputs.enabled == 'true'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag=$(gh release view "${REQUESTED_TAG:-}" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease --jq 'select(.isDraft == false and .isPrerelease == false) | .tagName')
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a published stable release'; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq makepkg
          ./scripts/bump-aur.sh "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Push to AUR
        if: steps.config.outputs.enabled == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur-publish
          chmod 600 ~/.ssh/aur-publish
          ssh-keyscan -T 10 -t ed25519 aur.archlinux.org > ~/.ssh/aur-known-hosts
          # Fingerprint published at https://aur.archlinux.org/.
          fingerprint=$(ssh-keygen -lf ~/.ssh/aur-known-hosts | awk '{print $2}')
          [ "$fingerprint" = 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4' ] || { echo 'AUR host key mismatch'; exit 1; }
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur-publish -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/aur-known-hosts'
          work=$(mktemp -d)
          trap 'rm -rf "$work"; rm -f ~/.ssh/aur-publish' EXIT
          git clone ssh://aur@aur.archlinux.org/clovercut-bin.git "$work/aur"
          remote_version=$(sed -n 's/^pkgver=//p' "$work/aur/PKGBUILD" | head -1)
          if dpkg --compare-versions "$remote_version" gt "${TAG#v}"; then
            echo '::notice::AUR already has a newer version; refusing to downgrade.'
            exit 0
          fi
          cp assets/arch/PKGBUILD assets/arch/.SRCINFO "$work/aur/"
          cd "$work/aur"
          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git -c user.name=clovercut-ci -c user.email=clovercut-ci@users.noreply.github.com commit -m "Update to $TAG"
            git push origin HEAD:master
          fi
